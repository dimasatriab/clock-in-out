<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hadir">
  <title>Hadir — Absensi karyawan</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="kerangka" id="layar"></main>
  <div id="kamera" class="depan">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="kotak-wajah"></canvas>
    <div class="depan-isi">
      <header class="depan-kepala">
        <h1 class="depan-judul"><span id="merek" class="merek">DBLESSMYRA</span><span class="sub">Attendance</span></h1>
        <div class="depan-tautan">
          <button class="tautan-halus" id="tautan-admin" type="button" hidden>Admin</button>
          <button class="tautan-halus" id="kamera-riwayat" type="button">Status</button>
        </div>
      </header>
      <div class="depan-lembar">
        <div class="depan-baris">
          <span id="centang-wajah" class="centang" data-keadaan="tunggu" role="img" aria-label="Wajah menunggu"></span>
          <span class="depan-nama">Wajah</span>
          <span id="kamera-status" class="depan-detail">Menunggu wajah</span>
        </div>
        <div class="depan-baris">
          <span id="centang-lokasi" class="centang" data-keadaan="tunggu" role="img" aria-label="Lokasi menunggu"></span>
          <span class="depan-nama">Lokasi</span>
          <span id="lokasi-depan" class="depan-detail">Mengecek lokasi…</span>
        </div>
        <button class="tombol-garis" id="kamera-pin" type="button">login with pin</button>
      </div>
    </div>
  </div>
  <script type="module" src="/js/employee.js"></script>
</body>
</html>
