<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hadir">
  <title>Hadir — Absensi karyawan</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="kerangka" id="layar"></main>
  <div id="kamera" class="depan">
    <div class="depan-isi">
      <header class="depan-kepala">
        <h1 class="depan-judul"><span id="merek" class="merek">DBLESSMYRA</span><span class="sub">Attendance</span></h1>
        <button class="tautan-halus" id="kamera-riwayat" type="button">Status</button>
      </header>
      <div class="depan-pusat">
        <div class="depan-grup">
          <div class="lingkar">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="kotak-wajah"></canvas>
          </div>
          <p class="depan-status">
            <span id="lampu" class="titik siap"></span>
            <span id="kamera-status">Ready</span>
          </p>
        </div>
      </div>
      <div class="depan-kaki">
        <div id="konfirmasi" class="konfirmasi" hidden>
          <p id="konfirmasi-nama" class="nama-konfirmasi"></p>
          <p id="konfirmasi-hitung" class="mini"></p>
          <button id="konfirmasi-masuk" class="tombol-masuk" type="button">Clock In</button>
          <button id="konfirmasi-pulang" class="tombol-pulang" type="button">Clock Out</button>
        </div>
        <button class="tombol-garis" id="kamera-pin" type="button">login with pin</button>
      </div>
    </div>
    <div id="pita" class="pita" hidden></div>
  </div>
  <script type="module" src="/js/employee.js"></script>
</body>
</html>
